name: Build quiz deck
# Downloads timed birth records from the Open Gauquelin Database and writes
# the Guess the Chart deck (site/data/quiz.json). Runs on demand, monthly,
# and on pull requests that change the deck builder.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 3 * *"
  pull_request:
    paths: ["pipeline/build_quiz.py", ".github/workflows/build-quiz.yml"]
permissions:
  contents: write
jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build the deck
        run: python pipeline/build_quiz.py site/data/quiz.json
      - name: Commit the deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/quiz.json
          git diff --cached --quiet || git commit -m "Update Guess the Chart deck"
          git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
